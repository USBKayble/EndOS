name: Autonomous Claude Agent

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  check_run:
    types: [completed]
  repository_dispatch:
    types: [agent-rekick]   # self-triggered on disconnect

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # just under Actions 60min limit
    if: |
      github.event_name == 'issues' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure')

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Configure git
        run: |
          git config user.name "claude-agent"
          git config user.email "claude-agent@users.noreply.github.com"

      - name: Build task prompt
        id: prompt
        env:
          EVENT: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_NAME: ${{ github.event.check_run.name }}
          CHECK_SUMMARY: ${{ github.event.check_run.output.summary }}
          REKICK_TASK: ${{ github.event.client_payload.task }}
        run: |
          if [ "$EVENT" = "issues" ]; then
            PROMPT="Issue #$ISSUE_NUMBER opened: '$ISSUE_TITLE'. Body: $ISSUE_BODY. Fix this completely — investigate, patch, push a branch, open a PR referencing #$ISSUE_NUMBER, wait for CI to pass, then close the issue."
          elif [ "$EVENT" = "pull_request" ]; then
            PROMPT="PR #$PR_NUMBER opened: '$PR_TITLE'. Body: $PR_BODY. Review the changes, fix any issues found, ensure CI passes, then merge the PR."
          elif [ "$EVENT" = "check_run" ]; then
            PROMPT="CI check '$CHECK_NAME' failed. Summary: $CHECK_SUMMARY. Find the root cause in the codebase, fix it, commit, push, and confirm CI goes green."
          elif [ "$EVENT" = "repository_dispatch" ]; then
            PROMPT="$REKICK_TASK"
          fi
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT

      - name: Run agent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/agent.py "${{ steps.prompt.outputs.prompt }}"
