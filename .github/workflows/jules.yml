name: Auto-merge Jules PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'jules-google-labs[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        run: gh pr review --approve "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

The `github.actor` check makes this only fire on PRs opened by Jules, not your own PRs.

**3. Tie it to your existing build workflow**

Since EndOS already has GitHub Actions for building the ISO, make that build job a required status check (`Settings → Branches → Branch protection rules`). The auto-merge won't fire until the build passes — so if Jules pushes something broken, it won't merge.

---

### What the Full Flow Looks Like
```
You open/assign a GitHub issue → Jules reads it
Jules posts a plan comment → You tap "Approve" (only required step)
Jules executes, opens a PR → GitHub Actions triggers
Actions: approves + enables auto-merge → ISO build runs
Build passes → PR merges automatically
