name: Issue & PR Triage

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label-and-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run triage script
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            const isPr = !!context.payload.pull_request;
            const title = isPr ? context.payload.pull_request.title : (context.payload.issue ? context.payload.issue.title : '');
            const body = isPr ? context.payload.pull_request.body : (context.payload.issue ? context.payload.issue.body : '') || '';

            // simple heuristics
            const labels = [];
            if (/bug|fix|crash|error/i.test(title+body)) labels.push('bug');
            if (/doc|readme|documentation/i.test(title+body)) labels.push('documentation');
            if (/feat|feature|enhancement/i.test(title+body)) labels.push('enhancement');
            if (labels.length === 0) labels.push('triage');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (isPr) {
              // add label
              await github.rest.issues.addLabels({ owner, repo, issue_number: context.payload.pull_request.number, labels });
              // request review from CODEOWNERS if present
              // best-effort: request a random reviewer from the repo (placeholder)
            } else if (context.payload.issue) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: context.payload.issue.number, labels });
              // optionally assign to a default maintainer
              const MAINTAINER = process.env.DEFAULT_MAINTAINER || null;
              if (MAINTAINER) {
                await github.rest.issues.addAssignees({ owner, repo, issue_number: context.payload.issue.number, assignees: [MAINTAINER] });
              }
            }
