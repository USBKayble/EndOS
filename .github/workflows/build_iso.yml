name: Build EndOS ISO

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - 'build.sh'
      - '.github/workflows/build_iso.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      commit_sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Get latest dots-hyprland commit
        id: get_sha
        run: |
          SHA=$(curl -s "https://api.github.com/repos/end-4/dots-hyprland/commits/main" | jq -r .sha)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
      
      - name: Check cache for commit
        id: check_cache
        uses: actions/cache/restore@v4
        with:
          path: dots_version.txt
          key: dots-hyprland-${{ steps.get_sha.outputs.sha }}
          lookup-only: true
      
      - name: Decide whether to build
        id: decision
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ steps.check_cache.outputs.cache-hit }}" == "true" ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-updates
    if: needs.check-updates.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arch Linux environment
        run: |
          # Initialize pacman keyring
          pacman-key --init
          pacman-key --populate archlinux

          # Update system and install base dependencies
          pacman -Syu --noconfirm

          # Install build essentials
          pacman -S --noconfirm --needed \
            base-devel \
            git \
            archiso \
            rsync \
            python \
            python-pip \
            curl \
            wget \
            sudo \
            meson \
            ninja \
            patchelf \
            python-build \
            github-cli

          # Enable multilib repository
          echo "" >> /etc/pacman.conf
          echo "[multilib]" >> /etc/pacman.conf
          echo "Include = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
          pacman -Sy

      - name: Build ISO
        run: |
          # Initialize machine ID to prevent systemd-nspawn warnings
          systemd-machine-id-setup || true

          # Workaround for systemd-nspawn "Attempted to remove disk file system" error in containers
          mount --make-rshared / || true
          mount --make-rshared /run || true

          # Run the build script directly (it enforces root EUID internally)
          bash build.sh

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7

      - name: Post failure logs to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_TAIL=""
          if [ -f "build.log" ]; then
            LOG_TAIL=$(tail -n 100 build.log)
          else
            LOG_TAIL="build.log not found."
          fi

          COMMENT_BODY="## ❌ Build ISO Workflow Failed

          **Run Number:** ${{ github.run_number }}
          **Commit:** ${{ github.event.pull_request.head.sha }}

          You can view the full build logs in the [Action Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          <details>
          <summary><b>Last 100 lines of build.log</b></summary>

          \`\`\`
          $LOG_TAIL
          \`\`\`

          </details>"

          # Write to a file to preserve formatting and handle special characters
          echo "$COMMENT_BODY" > pr_comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr_comment.md

      - name: Split ISO for Release
        run: |
          cd out
          ISO_FILE=$(ls endos-*.iso | head -n 1)
          SHA256=$(sha256sum "$ISO_FILE" | cut -d ' ' -f 1)
          echo "ISO_SHA256=$SHA256" >> $GITHUB_ENV
          echo "ISO_NAME=$ISO_FILE" >> $GITHUB_ENV
          
          echo "Splitting $ISO_FILE into 2GB chunks..."
          split -b 2000M -d "$ISO_FILE" "endos-part"
          rm "$ISO_FILE"
          ls -lh

      - name: Generate Release Tag
        id: tag
        run: echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.tag.outputs.date }}
          name: EndOS Build ${{ steps.tag.outputs.date }}
          body: |
            Automated build of EndOS.
            
            **ISO File**: `${{ env.ISO_NAME }}`
            **SHA256 Checksum**: `${{ env.ISO_SHA256 }}`
            
            ## Installation Instructions
            
            The ISO has been split into 2GB parts to satisfy GitHub's file size limits.
            
            **To combine the parts:**
            ```bash
            # Linux/macOS
            cat endos-part* > ${{ env.ISO_NAME }}
            
            # Windows (PowerShell)
            Get-Content endos-part* -Raw | Set-Content -Path "${{ env.ISO_NAME }}" -Encoding Byte
            ```
            
            **Verify the checksum:**
            ```bash
            sha256sum ${{ env.ISO_NAME }}
            # Should match: ${{ env.ISO_SHA256 }}
            ```
          files: |
            out/endos-part*
            out/build.log

      - name: Prepare cache file
        if: success()
        run: touch dots_version.txt

      - name: Save build cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: dots_version.txt
          key: dots-hyprland-${{ needs.check-updates.outputs.commit_sha }}
