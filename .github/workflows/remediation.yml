name: CI Remediation

on:
  workflow_run:
    types: [completed]

permissions:
  checks: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  rerun-and-diagnose:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Gather run info
        id: info
        uses: actions/github-script@v6
        with:
          script: |
            const run = github.context.payload.workflow_run;
            return { id: run.id, url: run.html_url, name: run.name, sha: run.head_sha, prs: (run.pull_requests || []).map(p=>p.number) };
      - name: Rerun workflow once
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const runId = ${JSON.stringify('${{ steps.info.outputs.id }}')};
            try {
              await github.rest.actions.reRunWorkflow({ owner: context.repo.owner, repo: context.repo.repo, run_id: github.context.payload.workflow_run.id });
              core.info('Requested rerun');
            } catch (e) {
              core.info('Rerun request failed: ' + e.message);
            }
      - name: Create diagnostic issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = github.context.payload.workflow_run;
            const title = `CI Remediation: ${run.name} failed on ${run.head_sha.substring(0,7)}`;
            const body = `The workflow **${run.name}** failed. Run: ${run.html_url}\n\nI attempted an automated rerun (if permitted). Please check logs and assign this issue for triage.`;
            const { data } = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['ci','failure','auto-remediation'] });
            core.setOutput('issue', data.number);
      - name: Comment on associated PRs
        if: ${{ steps.info.outputs.prs != '' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = github.context.payload.workflow_run;
            for (const pr of run.pull_requests || []) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: `CI failure detected in workflow **${run.name}**. I attempted an automated rerun and opened an issue to track it. Run: ${run.html_url}` });
            }
