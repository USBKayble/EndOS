name: Auto-merge PRs

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  attempt-automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt auto-merge when policy satisfied
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : (context.payload.issue ? context.payload.issue.number : null);
            if (!prNumber) return;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

            // Require at least 1 approval
            const { data: reviews } = await github.rest.pulls.listReviews({ owner, repo, pull_number: prNumber });
            const approvals = reviews.filter(r => r.state === 'APPROVED').map(r => r.user.login);
            const uniqueApprovals = [...new Set(approvals)];
            if (uniqueApprovals.length < 1) {
              core.info(`Not merging: need at least 1 approval (have ${uniqueApprovals.length}).`);
              return;
            }

            // Check that all check runs for the PR head sha have succeeded
            const ref = pr.head.sha;
            const { data: checkSuites } = await github.request('GET /repos/{owner}/{repo}/check-suites-for-ref', { owner, repo, ref });
            let allPassed = true;
            for (const suite of checkSuites.check_suites || []) {
              const { data: runs } = await github.rest.checks.listForSuite({ owner, repo, check_suite_id: suite.id });
              for (const run of runs.check_runs || []) {
                if (run.conclusion !== 'success') {
                  allPassed = false;
                  core.info(`Check run ${run.name} concluded: ${run.conclusion}`);
                  break;
                }
              }
              if (!allPassed) break;
            }
            if (!allPassed) {
              core.info('Not merging: not all checks passed.');
              return;
            }

            // Merge using squash (policy can be adjusted)
            await github.rest.pulls.merge({ owner, repo, pull_number: prNumber, merge_method: 'squash' });
            await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: 'Auto-merged by automation: all checks passed and required approvals satisfied.' });
